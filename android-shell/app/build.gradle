plugins {
    id 'com.android.application'
}
android {
    namespace 'app.boop.collect'
    compileSdk 36
    defaultConfig {
        applicationId 'app.boop.collect'
        minSdk 23
        targetSdk 36
        versionCode (System.getenv('BOOP_VERSION_CODE') ?: '2').toInteger()
        versionName (System.getenv('BOOP_VERSION_NAME') ?: '2.0.0')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
