    <script>
      (function() {
        var origErr = console.error;
        var origWarn = console.warn;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            return;
          }
          origErr.apply(console, arguments);
        };
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
