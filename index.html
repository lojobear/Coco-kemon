<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function isViteNoise(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
          return typeof str === 'string' && (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1);
        }
        var origErr = console.error;
        var origWarn = console.warn;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteNoise(arguments[i])) return;
          }
          origErr.apply(console, arguments);
        };
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteNoise(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isViteNoise(e.message) || isViteNoise(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteNoise(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131020" />
    <meta name="theme-color" content="#131020" media="(prefers-color-scheme: dark)" />

  </head>
