name: Boop Native Play Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: '2.0.0'
      version_code:
        description: Positive integer greater than every previous Play upload
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOOP_VERSION_NAME: ${{ inputs.version_name }}
      BOOP_VERSION_CODE: ${{ inputs.version_code }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$BOOP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Version code must be a positive integer"; exit 1; }
          [[ "${#BOOP_VERSION_NAME}" -le 50 && -n "$BOOP_VERSION_NAME" ]] || { echo "Invalid version name"; exit 1; }
          [[ "$HAS_SIGNING_KEY" == true ]] || { echo "Configure the Android upload signing secrets before building"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_TOOL"
          "$SDK_TOOL" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build release bundle
        run: gradle --no-daemon -p android-shell bundleRelease
      - name: Sign and verify bundle
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEY_FILE"
          BUNDLE=android-shell/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$KEY_FILE" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD "$BUNDLE" "$KEY_ALIAS"
          jarsigner -verify "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: Boop-Play-AAB-${{ inputs.version_code }}
          path: android-shell/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
