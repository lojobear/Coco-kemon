name: Boop Android APK

on:
  pull_request:
    paths: ['android-shell/**', 'src/**', 'server/**', 'server.ts', 'public/**', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android-shell/**', 'src/**', 'server/**', 'server.ts', 'public/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_TOOL"
          "$SDK_TOOL" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package Boop icon
        run: |
          mkdir -p android-shell/app/src/main/res/drawable-nodpi
          cp public/pwa-192x192.png android-shell/app/src/main/res/drawable-nodpi/boop_icon.png
      - name: Build installable Android debug APK
        run: gradle --no-daemon -p android-shell assembleDebug
      - name: Upload Boop APK
        uses: actions/upload-artifact@v4
        with:
          name: Boop-Android-APK
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
