name: Boop viewport smoke
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/viewport-smoke.mjs'
      - '.github/workflows/viewport-smoke.yml'
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Check mobile, tablet and desktop
        run: |
          npm run dev > /tmp/boop-server.log 2>&1 &
          for i in {1..60}; do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node tests/viewport-smoke.mjs
          node tests/procedures-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boop-viewport-screenshots
          path: /tmp/boop-viewport/*.png
          if-no-files-found: ignore
