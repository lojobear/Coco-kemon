name: Boop Lightweight Online APK

on:
  pull_request:
    paths: ['android-shell/**', '.github/workflows/android-online-apk.yml']
  push:
    branches: [main]
    paths: ['android-shell/**', '.github/workflows/android-online-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-online-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOP_BUNDLED_WEB: '0'
      BOOP_LIVE_WEB: '1'
      BOOP_VERSION_NAME: '3.14.1-online'
      BOOP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_TOOL"
          "$SDK_TOOL" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Record shell revision without bundling the website
        run: |
          test ! -d android-shell/app/src/main/assets/web
          mkdir -p android-shell/app/src/main/assets
          git rev-parse HEAD > android-shell/app/src/main/assets/source-commit.txt
      - name: Build lightweight installer
        run: gradle --no-daemon -p android-shell assembleDebug
      - name: Verify APK size and contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os, subprocess
          apk = Path('android-shell/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.stat().st_size < 10 * 1024 * 1024, 'Online APK must stay below 10 MiB'
          with ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert 'assets/source-commit.txt' in archive.namelist()
              assert not any(name.startswith('assets/web/') for name in archive.namelist())
          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or '/usr/local/lib/android/sdk')
          badging = subprocess.check_output([str(sdk / 'build-tools/36.0.0/aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='app.boop.collect.online'" in badging, 'Online app must install separately from existing apps'
          assert "application-label:'Boop Online'" in badging
          print(f'Online APK: {apk.stat().st_size:,} bytes; no bundled website assets')
          PY
      - name: Upload lightweight Boop APK
        uses: actions/upload-artifact@v4
        with:
          name: Boop-Online-APK
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
