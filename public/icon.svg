<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2d3340" stroke-width="8"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#goldGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Alchemical Ring & Orbitals -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#374151" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Orbiting Sparks -->
  <circle cx="256" cy="106" r="12" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="362" cy="362" r="9" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="362" r="9" fill="#10b981" filter="url(#glow)"/>

  <!-- Central Alchemical Emblem: Omega Ω -->
  <path d="M 190 340 L 140 340 C 135 340 130 335 130 330 C 130 325 135 320 140 320 L 180 320 C 172 300 160 270 160 230 C 160 174 203 130 256 130 C 309 130 352 174 352 230 C 352 270 340 300 332 320 L 372 320 C 377 320 382 325 382 330 C 382 335 377 340 372 340 L 322 340 C 314 340 308 333 310 325 C 324 285 332 255 332 230 C 332 185 298 150 256 150 C 214 150 180 185 180 230 C 180 255 188 285 202 325 C 204 333 198 340 190 340 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Inner Spark -->
  <path d="M 256 195 L 263 218 L 286 225 L 263 232 L 256 255 L 249 232 L 226 225 L 249 218 Z" fill="#ffffff"/>
</svg>
